name: Build Packages & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-packages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y debhelper dpkg-dev rpm

      - name: Build Debian (.deb) Package
        run: |
          mkdir -p build/deb/DEBIAN build/deb/usr/local/bin build/deb/etc/modprobe.d build/deb/etc/udev/rules.d build/deb/etc/udev/hwdb.d build/deb/etc/systemd/system build/deb/usr/lib/systemd/user build/deb/etc/pipewire/pipewire.conf.d build/deb/etc/xdg/autostart
          # /usr/local/bin is a deliberate choice (parity with install_dkms.sh and
          # every shipped unit ExecStart); kept identical across deb/rpm/PKGBUILD.
          cp packaging/debian/control packaging/debian/postinst build/deb/DEBIAN/
          chmod 755 build/deb/DEBIAN/postinst
          cp tools/d330-* build/deb/usr/local/bin/
          cp tools/lenovo-d330-power-tune.sh build/deb/usr/local/bin/
          rm -f build/deb/usr/local/bin/d330-acpi-override.sh build/deb/usr/local/bin/d330-pen-config.sh
          for f in d330-tablet-daemon.py d330-sensor-filter.py d330-tray.py d330-auto-hibernate.py d330-refresh-screen.sh d330-microsd-setup.sh d330-thermal-tune.sh d330-fastboot-tune.sh d330-vaapi-check.sh lenovo-d330-power-tune.sh; do mv "build/deb/usr/local/bin/$f" "build/deb/usr/local/bin/${f%.*}"; done
          chmod 755 build/deb/usr/local/bin/*
          cp patches/*/etc/modprobe.d/*.conf build/deb/etc/modprobe.d/
          cp patches/*/etc/udev/rules.d/*.rules build/deb/etc/udev/rules.d/
          cp patches/*/etc/udev/hwdb.d/*.hwdb build/deb/etc/udev/hwdb.d/
          cp patches/*/etc/systemd/system/*.service build/deb/etc/systemd/system/
          cp patches/*/usr/lib/systemd/user/*.service build/deb/usr/lib/systemd/user/
          cp patches/audio_dsp/etc/pipewire/pipewire.conf.d/*.conf build/deb/etc/pipewire/pipewire.conf.d/
          cp patches/hardware_controls/etc/xdg/autostart/d330-tray.desktop build/deb/etc/xdg/autostart/
          dpkg-deb --build build/deb lenovo-d330-fix_7.0.0_all.deb

      - name: Bundle DKMS Tarball
        run: |
          tar -czf lenovo-d330-fix-dkms.tar.gz patches/dkms/

      - name: Generate SHA256 Checksums
        run: |
          sha256sum lenovo-d330-fix_7.0.0_all.deb lenovo-d330-fix-dkms.tar.gz > SHA256SUMS

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            lenovo-d330-fix_7.0.0_all.deb
            lenovo-d330-fix-dkms.tar.gz
            SHA256SUMS

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            lenovo-d330-fix_7.0.0_all.deb
            lenovo-d330-fix-dkms.tar.gz
            SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
