name: Build FydeOS Kernel (R150 chromeos-6.12)

# Manual dispatch only: FydeOS variant of the ChromeOS kernel build.
# Source tree: chromiumos/third_party/kernel @ release-R150-16700.B-chromeos-6.12
# — the branch of truth read from the shipped image itself: FydeOS for PC slim
# v23.0-SP1 (amd64-fydeos_slim, SHA-256 4679828fcc53...b2c8) boots
# "Linux version 6.12.54-fyde-01180-gb4e10020ba49-dirty", and b4e10020 is this
# branch's tip (local pre-verification 2026-10-23: kernel 6.12.54, both patches
# check+apply on a pristine tip, LF and CRLF checkouts alike). This supersedes
# the earlier openFyde-manifest-derived R132-6.6 branch choice; the superseded
# R132 dispatch (run 40014541648) and the adaptation record live in
# patches/fydeos/README.md.
#
# Patches: both 6.12 variants in patches/fydeos/ — CCS re-anchored for the
# intel_display refactor (struct intel_display first params, display->drm),
# GLK reset fix dispatched via IS_GEMINILAKE(i915).
# Config: in-tree chromeos fragments via chromeos/scripts/prepareconfig
# (DM_VERITY/BLK_DEV_DM/DRM_I915 =y — the boot-critical set a generic
# defconfig lacks), with CONFIG_LOCALVERSION="-fyde-01180" +
# CONFIG_LOCALVERSION_AUTO=y reproducing the shipped kernel banner
# 6.12.54-fyde-01180-g<12-char-sha>-dirty (the -g<sha>-dirty suffix comes from
# setlocalversion against this shallow clone with the gate's patches applied),
# so the image's /lib/modules directory name matches the built kernel.
# Publishing an unpatched kernel is structurally impossible: the patch gate is
# the FIRST step after fetch (AUDIT-03) and upload-artifact runs only on
# prior success — a red gate or a disk/time overrun means no artifact, never
# a truncated one (CHRM-02 honest-stop).
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch of chromiumos/third_party/kernel to build (FydeOS R150 / 6.12 line)'
        required: true
        default: 'release-R150-16700.B-chromeos-6.12'
      patches:
        description: 'Apply the D330 patch pair. false = pristine b4e10020 code with config only (resume-bisect A/B), published under a distinct artifact name'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build-fydeos-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Free disk space
        run: |
          set -euxo pipefail
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/lib/jvm \
            /usr/local/lib/node_modules
          df -h /

      - name: Install build toolchain
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libssl-dev libdw-dev bc flex bison rsync \
            libelf-dev dwarves cpio zstd kmod ca-certificates

      # No submodule step (Phase 57 lesson): the chromeos kernel repo is
      # self-contained; every later step runs under `set -euxo pipefail`, so a
      # missing Kconfig/derived file turns the job red as an honest stop.
      - name: Fetch kernel source
        env:
          REF: ${{ inputs.ref }}
        run: |
          set -euxo pipefail
          BUILD="$RUNNER_TEMP/kbuild"
          git clone --depth 1 --branch "$REF" \
            https://chromium.googlesource.com/chromiumos/third_party/kernel \
            "$BUILD/kernel"
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"
          echo "SRC=$BUILD/kernel" >> "$GITHUB_ENV"

      # Patch gate — AUDIT-03 rule: re-verify both patches FIRST against the
      # freshly fetched tree (pre-verified locally 2026-10-23 at pristine tip
      # b4e10020, kernel 6.12.54). Both `--check`s before either apply; CCS
      # then GLK, never --3way/-f; grep anchors prove the code landed. Under
      # set -e any failure exits red BEFORE any build step. Dispatch-explicit
      # opt-out (inputs.patches=false, default true) builds pristine code for
      # the resume bisect and is published as fydeos-kernel-nopatches — it can
      # never be mistaken for release material.
      - name: Patch gate — check, apply (CCS then GLK), prove they landed
        if: ${{ inputs.patches }}
        run: |
          set -euxo pipefail
          cd "$SRC"
          git apply --check "$GITHUB_WORKSPACE/patches/fydeos/d330_fydeos_6.12.patch"
          git apply --check "$GITHUB_WORKSPACE/patches/fydeos/d330_fydeos_glk_reset_fix_6.12.patch"
          git apply "$GITHUB_WORKSPACE/patches/fydeos/d330_fydeos_6.12.patch"
          git apply "$GITHUB_WORKSPACE/patches/fydeos/d330_fydeos_glk_reset_fix_6.12.patch"
          # CCS anchors
          grep -R 'lenovo_ideapad_d330_10igl_800x1280' drivers/gpu/drm/drm_panel_orientation_quirks.c
          grep -R 'dmi_match(DMI_PRODUCT_NAME, "82H0")' drivers/gpu/drm/i915/display/skl_universal_plane.c
          grep -R 'intel_fb_is_ccs_modifier' drivers/gpu/drm/i915/display/skl_universal_plane.c
          grep -R 'quirk_lenovo_d330_pps' drivers/gpu/drm/i915/display/intel_quirks.c
          grep -R 'QUIRK_INCREASE_PPS_CYCLE_DELAY' drivers/gpu/drm/i915/display/intel_quirks.h
          grep -R 'Clamping PPS power-cycle delay to 600ms' drivers/gpu/drm/i915/display/intel_pps.c
          # GLK anchors
          grep -R 'Running INIT_OTP (GPIO/delay only) as DEASSERT_RESET' drivers/gpu/drm/i915/display/intel_bios.c
          grep -R 'glk_fixup_mipi_sequences' drivers/gpu/drm/i915/display/intel_bios.c

      # Config = the tree's own chromeos x86_64 fragments (prepareconfig =
      # base.config + arch common + flavour, the documented chromiumos flow),
      # not a generic defconfig: the fragments carry the chromeos boot set
      # (CONFIG_DM_VERITY=y, CONFIG_DM_VERITY_CHROMEOS=y, CONFIG_BLK_DEV_DM=y,
      # CONFIG_DRM_I915=y, CONFIG_DRM_I915_FORCE_PROBE="*") that x86_64_
      # defconfig lacks — without them the verity-rooted FydeOS image cannot
      # mount and there is no display. LOCALVERSION/-AUTO reproduce the shipped
      # banner for vermagic parity with the image's modules.
      - name: Configure (chromeos x86_64 fragments + banner parity)
        run: |
          set -euxo pipefail
          cd "$SRC"
          export CHROMEOS_KERNEL_FAMILY=chromeos
          bash chromeos/scripts/prepareconfig chromiumos-x86_64-generic
          if [ "${{ inputs.patches }}" = "true" ]; then
            scripts/config --set-str LOCALVERSION "-fyde-01180"
            scripts/config --enable LOCALVERSION_AUTO
          else
            # Pristine tree: setlocalversion would append -g<sha> with no
            # -dirty. Hardcode the full stock suffix instead so the banner and
            # /lib/modules dirname stay byte-identical either way.
            scripts/config --set-str LOCALVERSION "-fyde-01180-gb4e10020ba49-dirty"
            scripts/config --disable LOCALVERSION_AUTO
          fi
          # D330 panel-power path (Phase 60 black-screen triage): the stock
          # FydeOS kernel builds intel-skl-int3472 + its GPIO companion builtin
          # (verified against the shipped modules.builtin). The reference-board
          # config has CONFIG_REGULATOR off, which hides INTEL_SKL_INT3472 from
          # Kconfig entirely (depends on REGULATOR) -> no driver for the ACPI
          # INT3472 GPIO/power-gate device -> panel reset line never driven ->
          # boot completes with voice but panel stays dark. Same i915 patches
          # lit the panel on Ubuntu, which builds this driver in.
          scripts/config --enable REGULATOR
          scripts/config --enable INTEL_SKL_INT3472
          scripts/config --enable GPIO_TPS68470
          # Strip debug info and the git-version override risks: the runner
          # has only ~14 GB of disk, and the result stays a normal bootable
          # kernel. LOCALVERSION must come from .config only — a make
          # LOCALVERSION= argument would break the banner parity.
          scripts/config --enable DEBUG_INFO_NONE || true
          scripts/config --disable DEBUG_INFO_BTF || true
          scripts/config --disable GDB_SCRIPTS || true
          # Insurance, not observed breakage: drop any blanket -Werror.
          scripts/config --disable WERROR || true
          # Drop the distro signing-cert paths: nothing signs this bzImage.
          scripts/config --set-str SYSTEM_TRUSTED_KEYS "" || true
          scripts/config --set-str SYSTEM_REVOCATION_KEYS "" || true
          make olddefconfig

      - name: Build kernel bzImage
        run: |
          set -euxo pipefail
          cd "$SRC"
          make -j"$(nproc)" bzImage
          mkdir -p "$BUILD/out"
          cp arch/x86/boot/bzImage System.map .config "$BUILD/out/"
          cd "$BUILD/out"
          sha256sum bzImage System.map .config > SHA256SUMS

      - name: Upload kernel artifact
        # CHRM-02 belt-and-braces: publish only after a fully green job, and
        # treat any missing file as red instead of uploading a partial bundle.
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.patches && 'fydeos-kernel' || 'fydeos-kernel-nopatches' }}
          if-no-files-found: error
          # .config is a dotfile; upload-artifact ≥v4.4 excludes hidden files
          # by default, which would drop it from the artifact while SHA256SUMS
          # still hashes it (breaking `sha256sum -c` post-download).
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/kbuild/out/bzImage
            ${{ runner.temp }}/kbuild/out/System.map
            ${{ runner.temp }}/kbuild/out/.config
            ${{ runner.temp }}/kbuild/out/SHA256SUMS
