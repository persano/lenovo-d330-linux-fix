name: Build Patched Kernel (.deb)

# Manual dispatch only. A kernel build is heavy (~40 min) and is pinned to one
# Ubuntu release + kernel ABI. Run it once per `uname -r` you want a kernel for,
# then download the .deb and install it on the tablet. This exists because the
# D330 (Celeron N4020, 4 GB) takes hours to compile a kernel locally.
on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: 'Target kernel from `uname -r` (e.g. 7.0.0-38-generic)'
        required: true
        default: '7.0.0-38-generic'
      ubuntu_release:
        description: 'Ubuntu codename from `lsb_release -cs` (e.g. questing)'
        required: true

permissions:
  contents: write

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Free disk space
        run: |
          set -euxo pipefail
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/lib/jvm \
            /usr/local/lib/node_modules
          df -h /

      - name: Install build toolchain
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential dpkg-dev debhelper fakeroot dh-python libssl-dev \
            libdw-dev bc flex bison rsync libelf-dev dwarves cpio zstd kmod \
            ca-certificates

      - name: Add target Ubuntu sources (deb + deb-src)
        env:
          REL: ${{ inputs.ubuntu_release }}
        run: |
          set -euxo pipefail
          sudo tee /etc/apt/sources.list.d/target.sources >/dev/null <<EOF
          Types: deb deb-src
          URIs: http://archive.ubuntu.com/ubuntu
          Suites: ${REL} ${REL}-updates ${REL}-security
          Components: main universe
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          sudo apt-get update

      - name: Resolve exact source version and extract its config
        env:
          KV: ${{ inputs.kernel_version }}
          REL: ${{ inputs.ubuntu_release }}
        run: |
          set -euxo pipefail
          BUILD="$RUNNER_TEMP/kbuild"
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"
          mkdir -p "$BUILD" && cd "$BUILD"
          # /boot/config-* moved between releases: resolute (26.04) ships it in
          # linux-modules-*, older kernels in linux-image-unsigned-*. Try each.
          # -t pins the target release: the runner's own archive may carry a
          # higher-versioned backport of the same kernel (e.g. noble's
          # 7.0.0-38.38~24.04.4) that would otherwise win the download and
          # poison apt-get source with a version absent from the target.
          CFG=""
          for IMG in "linux-modules-${KV}" "linux-image-unsigned-${KV}" "linux-image-${KV}"; do
            apt-get download -t "$REL" "$IMG" || continue
            set -- "${IMG}"_*.deb
            DEB="$1"
            SRC_VER="$(dpkg-deb -f "$DEB" Version)"
            rm -rf cfg
            dpkg-deb -x "$DEB" cfg
            set -- cfg/boot/config-*
            if [ -e "$1" ]; then CFG="$1"; break; fi
          done
          if [ -z "$CFG" ]; then
            echo ">>> no /boot/config-* found in any package for ${KV}" >&2
            exit 1
          fi
          cp "$CFG" "$BUILD/kernel.config"
          echo "SRC_VER=${SRC_VER}" >> "$GITHUB_ENV"
          echo "source version: ${SRC_VER} (from ${DEB})"
          echo "config: ${CFG}"

      - name: Fetch kernel source
        run: |
          set -euxo pipefail
          cd "$BUILD"
          apt-get source "linux=${SRC_VER}"
          set -- linux-*/
          SRC="$1"
          echo "SRC=${BUILD}/${SRC}" >> "$GITHUB_ENV"

      - name: Apply the display fixes and prove they landed
        run: |
          set -euxo pipefail
          cd "$SRC"
          # patches/d330_dsi_resume_cycle.patch is a documented FAILED candidate
          # (45-02 iteration 1, see docs/research/NO_CLEAN_FIX_PROOF.md); not applied.
          git apply -p1 "$GITHUB_WORKSPACE/patches/d330_display_resume_fix.patch"
          grep -R 'dmi_match(DMI_PRODUCT_NAME, "82H0")' drivers/gpu/drm/i915/display/skl_universal_plane.c
          grep -R 'intel_fb_is_ccs_modifier(modifier)' drivers/gpu/drm/i915/display/skl_universal_plane.c
          # patches/d330_dsi_dump.patch is strictly-additive phase-47 instrumentation
          # (47-01): one new debugfs snapshot node + 2 wiring lines. It touches no
          # DSI enable/disable path and writes no registers, so it cannot change
          # what the boot-vs-resume arms measure.
          git apply -p1 "$GITHUB_WORKSPACE/patches/d330_dsi_dump.patch"
          grep -R 'i915_dsi_regs' drivers/gpu/drm/i915/display/
          grep -R 'bxt_dsi_pll_is_enabled' drivers/gpu/drm/i915/display/intel_dsi_dump_debugfs.c
          # patches/d330_dsi_device_ready_fix.patch is the phase-48 iteration-1
          # fix (48-01): DMI-gated to 82H0, clears retained DSI DEVICE_READY
          # state before the GLK enable probe so the resume enable path takes
          # the fresh-probe branch the working reload path takes.
          git apply -p1 "$GITHUB_WORKSPACE/patches/d330_dsi_device_ready_fix.patch"
          grep -R 'dmi_match(DMI_PRODUCT_NAME, "82H0")' drivers/gpu/drm/i915/display/vlv_dsi.c

      - name: Configure (seeded from the target kernel, no debug info)
        run: |
          set -euxo pipefail
          cd "$SRC"
          cp "$BUILD/kernel.config" .config
          # Strip debug info and the git-version suffix: the runner has only
          # ~14 GB of disk, and the result stays a normal bootable kernel.
          scripts/config --enable DEBUG_INFO_NONE || true
          scripts/config --disable DEBUG_INFO_BTF || true
          scripts/config --disable GDB_SCRIPTS || true
          scripts/config --disable LOCALVERSION_AUTO || true
          # Drop the distro signing-cert paths: bindeb-pkg replaces debian/,
          # which is exactly where those Canonical cert files live.
          scripts/config --set-str SYSTEM_TRUSTED_KEYS "" || true
          scripts/config --set-str SYSTEM_REVOCATION_KEYS "" || true
          make olddefconfig

      - name: Build kernel .deb packages
        run: |
          set -euxo pipefail
          cd "$SRC"
          rm -rf debian
          # DPKG_FLAGS=-d skips dpkg-checkbuilddeps, which chokes on the
          # generated debian/control's libdw-dev:native build-dep.
          make -j"$(nproc)" bindeb-pkg LOCALVERSION=-d330-fix DPKG_FLAGS=-d
          # bindeb-pkg drops the .debs in the parent of the source tree
          # (= $BUILD), not in $RUNNER_TEMP.
          ls -lh "$BUILD"/linux-image-*-d330-fix_*.deb \
                 "$BUILD"/linux-headers-*-d330-fix_*.deb

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v7
        with:
          name: kernel-deb
          path: |
            ${{ runner.temp }}/kbuild/linux-image-*-d330-fix_*.deb
            ${{ runner.temp }}/kbuild/linux-headers-*-d330-fix_*.deb
            ${{ runner.temp }}/kbuild/kernel.config

      - name: Publish kernel release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: kernel-${{ inputs.kernel_version }}
          name: Patched kernel for ${{ inputs.kernel_version }}
          prerelease: true
          files: |
            ${{ runner.temp }}/kbuild/linux-image-*-d330-fix_*.deb
            ${{ runner.temp }}/kbuild/linux-headers-*-d330-fix_*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
