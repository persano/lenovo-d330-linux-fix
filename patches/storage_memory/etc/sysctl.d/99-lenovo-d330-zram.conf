# Virtual Memory and ZRAM tuning for Lenovo IdeaPad D330-10IGL
# Optimizes 4GB LPDDR4 memory and prevents slow eMMC 5.1 write freezes

# High swappiness encourages kernel to page out cold anonymous memory to zram
# while keeping productive file page cache in physical RAM
vm.swappiness = 180

# Prioritize keeping directory dentry and inode caches in RAM
vm.vfs_cache_pressure = 50

# Disable watermark boost to avoid aggressive kswapd wakeups on low memory
vm.watermark_boost_factor = 0

# Bound maximum unwritten dirty pages to prevent blocking I/O spikes on 64GB eMMC
vm.dirty_bytes = 67108864
vm.dirty_background_bytes = 33554432

# ZRAM operates on single pages; disable multi-page clustering read-ahead overhead
vm.page-cluster = 0
