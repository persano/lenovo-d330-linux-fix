# Lenovo IdeaPad D330 X11 Touchscreen and Pen Coordinate Transformation
# Applies 90-degree clockwise matrix to align physical portrait sensor to landscape screen

Section "InputClass"
    Identifier "Lenovo D330 Touchscreen Calibration"
    MatchProduct "Goodix Capacitive TouchScreen"
    MatchIsTouchscreen "on"
    Driver "libinput"
    Option "TransformationMatrix" "0 1 0 -1 0 1 0 0 1"
EndSection

Section "InputClass"
    Identifier "Lenovo D330 Active Pen Calibration"
    MatchProduct "Goodix Active Pen|GDIX1001:00 Pen|stylus"
    MatchIsTablet "on"
    Driver "libinput"
    Option "TransformationMatrix" "0 1 0 -1 0 1 0 0 1"
    Option "PressureCurve" "0 10 90 100"
EndSection
