# Lenovo IdeaPad D330 TLP Power Management Configuration
# Tailored for fanless 6W Intel Celeron N4020 / N4120 / Pentium N5000

# CPU scaling governors and Energy Performance Preference (EPP)
CPU_SCALING_GOVERNOR_ON_AC=powersave
CPU_SCALING_GOVERNOR_ON_BAT=powersave

CPU_ENERGY_PERF_POLICY_ON_AC=balance_performance
CPU_ENERGY_PERF_POLICY_ON_BAT=power

# Limit max CPU frequency on battery to prevent fanless thermal runaway
CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=0

# Runtime Power Management: TLP is the SINGLE owner for the classes it manages
# (PCI/PCIe, USB, I2C, Intel audio DSP). The Phase 40 udev rule no longer writes
# the same knob, so TLP's AC/DC policy is never discarded. udev covers only the
# eMMC host controller and the dock (USB_DENYLIST below).
RUNTIME_PM_ON_AC=on
RUNTIME_PM_ON_BAT=auto

# PCIe Active State Power Management (ASPM)
PCIE_ASPM_ON_AC=default
PCIE_ASPM_ON_BAT=powersupersave

# Intel GPU power management (Intel UHD Graphics 600)
INTEL_GPU_MIN_FREQ_ON_AC=100
INTEL_GPU_MIN_FREQ_ON_BAT=100
INTEL_GPU_MAX_FREQ_ON_AC=650
INTEL_GPU_MAX_FREQ_ON_BAT=500
INTEL_GPU_BOOST_FREQ_ON_AC=700
INTEL_GPU_BOOST_FREQ_ON_BAT=500

# Audio power saving
SOUND_POWER_SAVE_ON_AC=1
SOUND_POWER_SAVE_ON_BAT=1
SOUND_POWER_SAVE_CONTROLLER=Y

# WiFi power saving (Intel Wireless-AC 9462)
WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=on

# USB Autosuspend (exclude Lenovo dock keyboard and touchpad)
USB_AUTOSUSPEND=1
USB_EXCLUDE_BTUSB=1
USB_DENYLIST="17ef:*"
