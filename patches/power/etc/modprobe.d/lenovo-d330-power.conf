# Lenovo IdeaPad D330 Kernel Power Optimization Parameters

# The D330 has no Intel Wi-Fi (Realtek RTL8821CE only), so no `iwlwifi`
# options are emitted; an `options iwlwifi ...` line would target an absent
# module and be silently ignored.

# PCIe ASPM is a kernel boot parameter, not a loadable module. To request the
# powersave policy add `pcie_aspm=powersave` to the kernel command line (e.g.
# via a /etc/default/grub.d snippet). An `options pcie_aspm ...` line is a
# dead reference to a non-existent module and is never emitted here.

# Intel graphics power management. `enable_psr` and `enable_fbc` are real
# in-tree i915 module parameters; `enable_rc6` was removed from the i915
# driver (absent since ~v6.1) and is deliberately not set.
options i915 enable_fbc=0 enable_psr=0
