Syntax 4

SectionUseCase."HiFi" {
	File "HiFi.conf"
	Comment "Lenovo IdeaPad D330 HiFi Audio"
}

BootSequence [
	cset "name='Headphone Switch' off"
	cset "name='Headphone Playback Volume' 80%"
	cset "name='Speaker Switch' on"
	cset "name='Speaker Playback Volume' 85%"
	cset "name='Internal Mic Switch' on"
	cset "name='Internal Mic Playback Volume' 80%"
	cset "name='Headset Mic Switch' off"
	cset "name='Headset Mic Playback Volume' 80%"
]
