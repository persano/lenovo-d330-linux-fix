# Lenovo IdeaPad D330 Audio & Microphone Kernel Configuration
# The HDA controller (8086:3198) enumerates with class 0x040300, i.e. no DSP.
# snd_intel_dsp_driver_probe() maps that class to SND_INTEL_DSP_DRIVER_LEGACY
# and SOF refuses it at sound/soc/sof/intel/hda.c ("the DSP is not enabled on
# this platform, aborting probe"), so forcing dsp_driver=3 left 0000:00:0e.0
# unbound and no sound card at all. Leave detection alone; it picks the legacy
# snd_hda_intel driver that this codec needs.

# SOF Gemini Lake HDA / DMIC common options
options snd_soc_sof_intel_hda_common dmic_num=2

# Quirk configuration for Everest Semi codec (ES8316 / ES8336)
# Bit 0: Speaker on OUT1, Bit 1: DMIC enable, Bit 4: Jack invert
options snd_soc_es8316 quirk=0x0013

# Fallback Realtek HDA options for ALC269 / ALC255 variants
options snd_hda_intel model=headset-mic,auto enable=1,1
