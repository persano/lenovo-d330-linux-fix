# Lenovo IdeaPad D330 Audio & Microphone Kernel Configuration
# Forces Intel Sound Open Firmware (SOF) DSP driver for Gemini Lake GLK/GLK-R

# Force SOF DSP driver over legacy SST/Skylake (dsp_driver=3 -> SOF)
options snd_intel_dspcfg dsp_driver=3

# SOF Gemini Lake HDA / DMIC common options
options snd_soc_sof_intel_hda_common dmic_num=2

# Quirk configuration for Everest Semi codec (ES8316 / ES8336)
# Bit 0: Speaker on OUT1, Bit 1: DMIC enable, Bit 4: Jack invert
options snd_soc_es8316 quirk=0x0013

# Fallback Realtek HDA options for ALC269 / ALC255 variants
options snd_hda_intel model=headset-mic,auto enable=1,1
