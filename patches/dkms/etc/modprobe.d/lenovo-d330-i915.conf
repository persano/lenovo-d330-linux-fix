# /etc/modprobe.d/lenovo-d330-i915.conf
# Display and Power Stabilization Configuration for Lenovo IdeaPad D330-10IGL (82H0)
#
# 1. Disable Panel Self-Refresh (PSR) to prevent Gen9 GLK-R display pipe lockup on DC6 exit.
# 2. Disable Framebuffer Compression (FBC) to prevent portrait scanout underflows.
# 3. Enable module parameter overrides for lenovo_d330_fix.

options i915 enable_psr=0 enable_fbc=0
options lenovo_d330_fix power_cycle_delay_ms=600 debug=1
