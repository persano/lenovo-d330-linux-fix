PACKAGE_NAME="lenovo-d330-fix"
PACKAGE_VERSION="1.0.0"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
# Supported kernel range: 5.15-5.99 and 6.x-9.x. BUILD_EXCLUSIVE_KERNEL is the
# effective hard-refusal guard; MAKE_MATCH alone falls back to a generic make
# for unmatched kernels rather than refusing (dkms.8.in).
MAKE_MATCH[0]="^(5\.(1[5-9]|[2-9][0-9])|[6-9]\.)"
BUILD_EXCLUSIVE_KERNEL[0]="^(5\.(1[5-9]|[2-9][0-9])|[6-9]\.)"
BUILT_MODULE_NAME[0]="lenovo_d330_fix"
# Explicit, default-equal location: protects `dkms install` if a future Makefile
# change moves the built .ko out of the source root.
BUILT_MODULE_LOCATION[0]="."
DEST_MODULE_LOCATION[0]="/updates/dkms"
AUTOINSTALL="yes"
