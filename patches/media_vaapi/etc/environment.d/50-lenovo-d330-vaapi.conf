# Environment variables for hardware video acceleration on Lenovo IdeaPad D330-10IGL
# Intel UHD Graphics 600 (Gemini Lake Refresh)

# Enforce Intel modern iHD Media Driver for VA-API
LIBVA_DRIVER_NAME=iHD

# Firefox VA-API video decode enablement in Wayland & X11
MOZ_DISABLE_RDD_SANDBOX=1
MOZ_ENABLE_WAYLAND=1

# Chromium / Electron VA-API flag hint
VDPAU_DRIVER=va_gl
