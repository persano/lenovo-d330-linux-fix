# Intel IPU3 Dual Camera Pipeline Configuration for Lenovo IdeaPad D330-10IGL
# Gemini Lake Refresh (Type 82H0, 81MD, 81H3)
# Subsystems: CIO2 (Intel IPU3), INT3472 ACPI Discrete Power Regulator, OV2680 & OV5648 Sensors

# Enable CIO2 bridge ACPI matching and INT3472 sensor power sequencing
options intel-ipu3-cio2
options intel-skl-int3472-discrete

# Sensor driver parameters (Omnivision OV2680 Front 2MP, OV5648 Rear 5MP)
# Ensures clock rate matching to CIO2 19.2MHz reference
options ov2680
options ov5648

# v4l2loopback options for legacy browser and video conferencing bridge
# Creates /dev/video10 (Front Camera) and /dev/video11 (Rear Camera)
options v4l2loopback exclusive_caps=1,1 card_label="D330 Front Camera (OV2680)","D330 Rear Camera (OV5648)" video_nr=10,11 max_buffers=4
