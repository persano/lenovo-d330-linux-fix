# SPDX-License-Identifier: CC0-1.0
# libcamera IPU3 IPA tuning data for Omnivision OV5648 (Rear 5MP Camera)
# Lenovo IdeaPad D330-10IGL
---
version: 1
algorithms:
  - BlackLevelCorrection:
      Red: 16
      GreenR: 16
      GreenB: 16
      Blue: 16
  - Awb:
      defaultEstimator: Bayes
      Bayes:
        temperatureK:
          - 2400
          - 2850
          - 3800
          - 5000
          - 6500
        redGain:
          - 1.30
          - 1.55
          - 1.78
          - 2.05
          - 2.38
        blueGain:
          - 2.65
          - 2.25
          - 1.80
          - 1.45
          - 1.18
  - Agc:
      exposureModes:
        Normal:
          shutter:
            - 100
            - 12000
            - 33333
          gain:
            - 1.0
            - 2.0
            - 16.0
      constraintModes:
        Normal:
          lower: 0.12
          upper: 0.88
  - ToneMapping:
      curve:
        - [0, 0]
        - [32, 65]
        - [64, 115]
        - [128, 180]
        - [192, 230]
        - [256, 255]
