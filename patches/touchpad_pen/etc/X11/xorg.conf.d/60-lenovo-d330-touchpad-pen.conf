# Lenovo IdeaPad D330-10IGL Touchpad and Active Pen Configuration for X11 / libinput

Section "InputClass"
    Identifier "Lenovo D330 Dock Touchpad"
    MatchIsTouchpad "on"
    MatchDevicePath "/dev/input/event*"
    Driver "libinput"
    Option "Tapping" "on"
    Option "TappingButtonMap" "lrm"
    Option "NaturalScrolling" "true"
    Option "DisableWhileTyping" "true"
    Option "AccelSpeed" "0.2"
    Option "ClickMethod" "clickfinger"
    Option "ScrollMethod" "twofinger"
    Option "MiddleEmulation" "true"
EndSection

Section "InputClass"
    Identifier "Lenovo D330 Active Pen"
    MatchIsTablet "on"
    MatchDevicePath "/dev/input/event*"
    Driver "libinput"
    Option "TransformationMatrix" "0 1 0 -1 0 1 0 0 1"
    Option "PressureCurve" "0.0 0.1 0.9 1.0"
EndSection
