# Lenovo IdeaPad D330-10IGL Audio Power Ramp & Anti-Pop Configuration
# Prevents DC offset clicks and pops when headphone DAC wakes/suspends

# Increase power save delay to 1000ms so DAC does not power cycle between brief sounds
options snd_soc_core pmdown_time=1000

# For Everest ES8316 / ES8336 codec drivers: enable soft volume ramp on sleep/wake
options snd_soc_es8316 power_save_node_latency=1000
options snd_soc_es8336 power_save_node_latency=1000

# Prevent aggressive power-down on Intel SST / SOF DSP
options snd_sof_intel_hda_common power_save_node_latency=1000
