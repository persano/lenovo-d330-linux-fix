# PipeWire Filter-Chain speaker DSP for the Lenovo IdeaPad D330-10IGL.
#
# This fragment MUST live under /etc/pipewire/pipewire.conf.d/ so the RUNNING
# PipeWire daemon loads it. Fragments under /etc/pipewire/filter-chain.conf.d/
# are only read by `pipewire -c filter-chain.conf` and were never active in the
# daemon (Phase 38, audit M7).
#
# The DSP is exposed as a virtual sink (effect_input.d330_speaker_dsp). Audio is
# NOT automatically rerouted: select this sink (e.g. `wpctl set-default <id>`)
# or route the hardware sink through it to reach the ES8336 speakers.

context.modules = [
    {   name = libpipewire-module-filter-chain
        args = {
            node.description = "Lenovo D330 Speaker DSP"
            media.name       = "Lenovo D330 Speaker DSP"
            filter.graph = {
                nodes = [
                    {   type  = builtin
                        name  = eq_hp
                        label = bq_highpass
                        control = { "Freq" = 130.0 "Q" = 0.707 }
                    }
                    {   type  = builtin
                        name  = eq_mid
                        label = bq_peaking
                        control = { "Freq" = 2800.0 "Q" = 1.2 "Gain" = 3.5 }
                    }
                    {   type  = builtin
                        name  = eq_air
                        label = bq_peaking
                        control = { "Freq" = 8000.0 "Q" = 1.0 "Gain" = 2.0 }
                    }
                    {   type  = builtin
                        name  = limit
                        label = clamp
                        # Hard clamp at ~-1.5 dBFS replaces the nonexistent
                        # `limiter` builtin and prevents full-scale clipping.
                        control = { "Min" = -0.8414 "Max" = 0.8414 }
                    }
                ]
                links = [
                    { output = "eq_hp:Out"  input = "eq_mid:In" }
                    { output = "eq_mid:Out" input = "eq_air:In" }
                    { output = "eq_air:Out" input = "limit:In" }
                ]
            }
            capture.props = {
                node.name      = "effect_input.d330_speaker_dsp"
                media.class    = "Audio/Sink"
                audio.channels = 2
                audio.position = [ FL FR ]
            }
            playback.props = {
                node.name      = "effect_output.d330_speaker_dsp"
                node.passive   = true
                audio.channels = 2
                audio.position = [ FL FR ]
            }
        }
    }
]
