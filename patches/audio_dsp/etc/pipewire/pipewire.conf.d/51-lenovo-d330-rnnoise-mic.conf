# PipeWire Filter-Chain RNNoise microphone denoiser for the Lenovo IdeaPad D330-10IGL.
#
# Requires the `librnnoise-ladspa` package, which provides librnnoise_ladspa.so.
# Debian/Ubuntu: `apt install librnnoise-ladspa`. The dependency is OPTIONAL:
# the module entry carries `flags = [ nofail ]` so a host without the plugin
# logs a warning and keeps the rest of PipeWire running instead of failing the
# daemon's startup entirely (upstream source-rnnoise.conf does the same).
#
# This fragment MUST live under /etc/pipewire/pipewire.conf.d/ so the RUNNING
# daemon loads it. The legacy /etc/pipewire/filter-chain.conf.d/ directory is
# only consumed by `pipewire -c filter-chain.conf` and left this graph inactive
# (Phase 38, audit M7).
#
# The denoised source is exposed as `rnnoise_source_d330`; select it as the
# default input (e.g. `wpctl set-default <id>`) to use it. Only the widely
# supported "VAD Threshold (%)" control is set: the VAD grace-period controls are
# version-dependent (present only in newer librnnoise builds) and are omitted so
# the graph also loads against older packages.

context.modules = [
    {   name = libpipewire-module-filter-chain
        flags = [ nofail ]
        args = {
            node.description = "Lenovo D330 Clean Microphone (RNNoise AI)"
            media.name       = "Lenovo D330 Clean Microphone"
            filter.graph = {
                nodes = [
                    {   type   = ladspa
                        name   = rnnoise
                        plugin = librnnoise_ladspa
                        label  = noise_suppressor_mono
                        control = { "VAD Threshold (%)" = 50.0 }
                    }
                ]
            }
            capture.props = {
                node.name    = "capture.d330_rnnoise"
                node.passive = true
            }
            playback.props = {
                node.name    = "rnnoise_source_d330"
                media.class  = "Audio/Source"
                audio.rate   = 48000
            }
        }
    }
]
