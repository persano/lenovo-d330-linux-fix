# PipeWire Filter-Chain DSP configuration for Lenovo IdeaPad D330-10IGL
# 1W Tablet Micro-Speakers Equalizer & Limiter
# Prevents physical speaker cone distortion and enhances speech intelligibility

filter_chain.nodes = [
    {
        type = builtin
        name = eq_sink_d330
        label = biquad
        control = {
            # High-pass filter at 130 Hz (Q=0.707) cuts sub-bass that causes speaker chassis rattle
            "Freq" = 130.0
            "Q" = 0.707
            "Gain" = 0.0
            "Type" = "Highpass"
        }
    }
    {
        type = builtin
        name = eq_peak_mid
        label = biquad
        control = {
            # Dialogue boost at 2800 Hz (+3.5 dB)
            "Freq" = 2800.0
            "Q" = 1.2
            "Gain" = 3.5
            "Type" = "Peaking"
        }
    }
    {
        type = builtin
        name = eq_air_high
        label = biquad
        control = {
            # Treble clarity boost at 8000 Hz (+2.0 dB)
            "Freq" = 8000.0
            "Q" = 1.0
            "Gain" = 2.0
            "Type" = "Peaking"
        }
    }
    {
        type = builtin
        name = limiter_d330
        label = limiter
        control = {
            # Hard limit at -1.5 dBFS to prevent speaker clipping
            "Limit" = -1.5
            "Release" = 50.0
        }
    }
]

context.modules = [
    {
        name = libpipewire-module-filter-chain
        args = {
            node.description = "Lenovo D330 Speaker DSP"
            media.name = "Lenovo D330 Speaker DSP"
            filter.graph = {
                nodes = $filter_chain.nodes
            }
            capture.props = {
                node.name = "effect_input.d330_speaker_dsp"
                media.class = "Audio/Sink"
                audio.channels = 2
                audio.position = [ FL FR ]
            }
            playback.props = {
                node.name = "effect_output.d330_speaker_dsp"
                node.passive = true
                audio.channels = 2
                audio.position = [ FL FR ]
            }
        }
    }
]
