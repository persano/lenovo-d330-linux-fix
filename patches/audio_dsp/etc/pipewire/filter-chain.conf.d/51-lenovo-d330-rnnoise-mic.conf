# PipeWire RNNoise Neural Microphone Denoising for Lenovo IdeaPad D330-10IGL
# Suppresses chassis handling vibration, keyboard typing, and room echo on internal dual DMIC array

filter_chain.nodes = [
    {
        type = ladspa
        name = rnnoise_source_d330
        plugin = librnnoise_ladspa
        label = noise_suppressor_mono
        control = {
            "VAD Threshold (%)" = 50.0
            "VAD Grace Period (ms)" = 200.0
            "Retroactive VAD Grace (ms)" = 0.0
        }
    }
]

context.modules = [
    {
        name = libpipewire-module-filter-chain
        args = {
            node.description = "Lenovo D330 Clean Microphone (RNNoise AI)"
            media.name = "Lenovo D330 Clean Microphone"
            filter.graph = {
                nodes = $filter_chain.nodes
            }
            capture.props = {
                node.name = "capture.d330_rnnoise"
                node.passive = true
            }
            playback.props = {
                node.name = "rnnoise_source_d330"
                media.class = "Audio/Source"
                audio.rate = 48000
            }
        }
    }
]
