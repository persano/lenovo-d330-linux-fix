# Wireless & Bluetooth Coexistence Parameters for Lenovo IdeaPad D330-10IGL
# Supports Realtek RTL8821CE / rtw88 and Intel Wireless-AC 9560 / 3165 (iwlwifi)

# Realtek RTL8821CE / rtw88 coexistence and antenna diversity
# ant_sel=2 routes primary signal to Aux antenna where BT isolation is superior
options rtl8821ce ant_sel=2 fwlps=0 ips=0
options rtw88_core disable_lps_deep=y
options rtw88_pci disable_aspm=y

# Intel Wireless iwlwifi BT coexistence & sleep stabilization
options iwlwifi bt_coex_active=1 power_save=1 uapsd_disable=1
options iwlmvm power_scheme=2
