# Wireless & Bluetooth Coexistence Parameters for Lenovo IdeaPad D330-10IGL
# Target radio: Realtek RTL8821CE (PCIe). The D330 has no Intel wireless, so
# no Intel Wi-Fi driver options are shipped here.

# Realtek RTL8821CE antenna selection.
# ant_sel=2 routes the primary signal to the Aux antenna, where Bluetooth
# isolation is superior.
#
# Both module spellings are emitted: the same silicon is driven either by the
# in-tree rtw88 driver (`rtw88_8821ce`) or by the legacy out-of-tree DKMS
# driver (`rtl8821ce`). Whichever the kernel ships reads its own line.
options rtl8821ce ant_sel=2
options rtw88_8821ce ant_sel=2

# In-tree rtw88 tuning (documented kernel module parameters):
#   rtw88_core.disable_lps_deep : skip the deep PCIe LPS transition that can
#                                 stall across S2idle resume
#   rtw88_pci.disable_aspm     : keep ASPM off on the RTL8821CE PCIe link
options rtw88_core disable_lps_deep=y
options rtw88_pci disable_aspm=y

# Note: Realtek Wi-Fi/BT coexistence (PTA time-division) is handled
# automatically by the driver and firmware. There is no manual coexistence
# module parameter to set; ant_sel is the only antenna parameter configured.
