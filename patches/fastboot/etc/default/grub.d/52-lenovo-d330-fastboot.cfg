# GRUB Fastboot Parameters for Lenovo IdeaPad D330-10IGL eMMC Storage
# Kernel watchdog detection is left at its default (softlockup/NMI detectors log
# a stack trace, they do not panic). The previous `nowatchdog` was removed
# because it disabled detection on a device whose premise is display pipe
# lockups, and a short-lived `softlockup_panic=1 panic=10` override was dropped
# because a transient boot-time soft lockup would then panic and auto-reboot,
# risking a boot loop. Keeps the remaining fastboot params.

GRUB_CMDLINE_LINUX_DEFAULT="${GRUB_CMDLINE_LINUX_DEFAULT} no_timer_check quiet loglevel=3 rd.systemd.show_status=auto"
