# GRUB Fastboot Parameters for Lenovo IdeaPad D330-10IGL eMMC Storage
# The watchdog-disabling parameter is replaced with softlockup_panic=1 so a hung
# boot self-recovers instead of going silent, on a device whose premise is
# display pipe lockups. Keeps the remaining fastboot params.

GRUB_CMDLINE_LINUX_DEFAULT="${GRUB_CMDLINE_LINUX_DEFAULT} softlockup_panic=1 no_timer_check quiet loglevel=3 rd.systemd.show_status=auto"
