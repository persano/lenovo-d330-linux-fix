# Lenovo IdeaPad D330-10IGL ACPI Early Initrd Override
# Prepends /boot/acpi-override.cpio ahead of the distro initramfs.
# grub.d/10_linux tests [ -e "${dirname}/${i}" ] and emits
# initrd ${rel_dirname}/${i}, where dirname is the kernel directory on the
# boot filesystem. The value must therefore be the bare file name; an
# absolute path is tested against <bootsysdir>/boot/acpi-override.cpio and
# is silently dropped, so the override never reaches grub.cfg.

if [ -f /boot/acpi-override.cpio ]; then
    GRUB_EARLY_INITRD_LINUX_CUSTOM="acpi-override.cpio"
fi
