# GRUB bootloader configuration for Lenovo IdeaPad D330-10IGL
# Fixes early kernel console rotation (fbcon), Plymouth boot splash, and GRUB menu font

# Force fbcon rotation (rotate:1 = 90 degrees clockwise for native portrait panel)
# Disable EFI BGRT boot logo distortion. video=efifb:nobgrt IS a real efifb
# option (parsed by efifb_setup(), drivers/video/fbdev/efifb.c) even though it is
# absent from the efifb.rst "Accepted options" table -- do not remove it.
# panel_orientation is drm-core syntax: whichever of DSI-1/eDP-1 exists on this
# device claims its token; an absent connector silently ignores its option.
GRUB_CMDLINE_LINUX_DEFAULT="${GRUB_CMDLINE_LINUX_DEFAULT} fbcon=rotate:1 video=efifb:nobgrt video=DSI-1:panel_orientation=right_side_up video=eDP-1:panel_orientation=right_side_up i915.enable_psr=0 i915.enable_fbc=0"

# Set optimal UEFI GOP resolution
GRUB_GFXMODE="1280x800,800x1280,auto"
GRUB_GFXPAYLOAD_LINUX="keep"

# Touchscreen-friendly GRUB timeout
GRUB_TIMEOUT=5
GRUB_RECORDFAIL_TIMEOUT=5
