# GRUB bootloader configuration for Lenovo IdeaPad D330-10IGL
# Hibernation resume activation -- TEMPLATE rendered at install time by
# scripts/install_dkms.sh: the two placeholder tokens below are substituted
# with the machine's real root filesystem UUID and /var/swapfile offset before
# this file is written to /etc/default/grub.d/. No machine-derived value is
# ever hardcoded in this repo file.

# Append resume=/resume_offset= so swsusp finds the disk-backed swapfile at boot
GRUB_CMDLINE_LINUX_DEFAULT="${GRUB_CMDLINE_LINUX_DEFAULT} resume=UUID=__D330_RESUME_UUID__ resume_offset=__D330_RESUME_OFFSET__"
